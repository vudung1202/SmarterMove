<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f3f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nước Hay — luyện cờ với boss</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <nav class="rail" aria-label="Điều hướng chính">
      <a class="mark" href="#/" aria-label="Nước Hay">
        <svg viewBox="0 0 28 28" width="28" height="28" aria-hidden="true">
          <rect width="14" height="14" fill="#141414"/><rect x="14" width="14" height="14" fill="#d9d5cd"/>
          <rect y="14" width="14" height="14" fill="#d9d5cd"/><rect x="14" y="14" width="14" height="14" fill="#1d5fbf"/>
        </svg>
      </a>
      <a class="nav" href="#/" data-route="home" title="Đấu với boss">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="6" r="2.5"/><path d="M9.5 10.5h5M10 10.5 9 17h6l-1-6.5M7 20.5h10M8 17.5h8"/></svg>
        <span>Đấu</span>
      </a>
      <a class="nav" href="#/review" data-route="review" title="Xem lại ván">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h3l3-6 4 12 3-6h5"/></svg>
        <span>Xem lại</span>
      </a>
    </nav>
    <main class="canvas" id="canvas" tabindex="-1"></main>
  </div>

  <dialog id="start" class="sheet" aria-labelledby="start-title">
    <form method="dialog" class="sheet-body">
      <div class="sheet-head">
        <div class="avatar sm"><img data-slot="piece" alt=""></div>
        <div>
          <h2 id="start-title"></h2>
          <p class="muted" data-slot="style"></p>
        </div>
      </div>
      <fieldset class="field">
        <legend>Bạn cầm quân</legend>
        <div class="segmented" role="group" aria-label="Màu quân">
          <button type="button" aria-pressed="true" value="w">Trắng</button>
          <button type="button" aria-pressed="false" value="b">Đen</button>
          <button type="button" aria-pressed="false" value="random">Ngẫu nhiên</button>
        </div>
      </fieldset>
      <label class="switch-row">
        <span>
          <span class="switch-title">Nhắc khi sắp mắc lỗi lớn</span>
          <span class="muted">Coach hỏi lại trước khi bạn đi một nước làm mất quân hoặc mất thế.</span>
        </span>
        <input type="checkbox" class="switch" name="alert" checked>
      </label>
      <div class="sheet-actions">
        <button class="btn ghost" value="cancel" formnovalidate>Để sau</button>
        <button class="btn primary" value="start" autofocus>Bắt đầu ván</button>
      </div>
    </form>
  </dialog>

  <script src="data.js"></script>
  <script src="app-data.js"></script>
  <script src="charts.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
